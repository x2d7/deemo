[package]
name = "deemo"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
image = "0.25.10"
pollster = "1.0.1"
rodio = "0.20"
fontdue = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }
wgpu = "30.0.1"
winit = "0.30.13"
guth-wayland-dnd = "0.3.1"

[dependencies.flate2]
version = "1"

[dev-dependencies]
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry"] }
